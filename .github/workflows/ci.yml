# Intégration continue : vérifie chaque pull request et chaque push sur main.
# Aucune publication, aucun secret : l'APK compilé est un APK DEBUG qui sert
# seulement à vérifier que le projet Android se construit. Il n'est pas
# conservé (pas d'artefact).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Format, analyse, tests, build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build APK debug (vérification uniquement)
        run: flutter build apk --debug
